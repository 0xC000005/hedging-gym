[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hedging-gym"
version = "0.1.0a1"
description = "Batched hedging environment, baseline methods and paper benchmarks"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt", "docs/belief-fb-LICENSE.txt"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "QuantLib==1.43",
    "torch==2.14.0",
    "gymnasium==1.2.3",
]

[project.optional-dependencies]
baselines = ["stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "tqdm==4.67.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]
baselines = ["hedging-gym[baselines]"]

[tool.hatch.build.targets.wheel]
packages = ["src/hedging_gym"]

[tool.hatch.build.targets.sdist]
include = ["src", "benchmarks", "tests", "docs", "README.md", "CONTRIBUTING.md", ".python-version", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
